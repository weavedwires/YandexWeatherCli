name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза, например 1.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -B

      - name: Extract version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          VERSION="${VERSION#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Некорректная версия: '${VERSION}'. Ожидается формат X.Y.Z" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package release archive
        run: |
          JAR=$(ls target/yweather-*.jar | grep -v 'original-' | head -n1)
          mkdir -p release
          cp "${JAR}" release/yweather.jar
          cp places.json release/
          cp api-key.txt.example release/
          cp README.md release/
          cp SKILL.md release/
          cd release
          zip -r "../yweather-${{ steps.version.outputs.VERSION }}.zip" .
          cd ..

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: yweather-${{ steps.version.outputs.VERSION }}
          path: yweather-${{ steps.version.outputs.VERSION }}.zip
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: yweather-${{ steps.version.outputs.VERSION }}.zip
          generate_release_notes: true
